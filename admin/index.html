<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nuestro Hueso</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1 class="titulo">Panel administrador</h1>
        <p class="subtitulo">Nuestro Hueso</p>
    </header>

    <nav class="links">
        <a href="../pets/index.html">Ir a la tienda</a>
    </nav>

    <main>
        <h2>Iniciar sesión</h2>
        <p class="aviso">Usa la cuenta de administrador. Usuario inicial: <strong>admin@gmail.com</strong> / <strong>admin123</strong></p>
        <form id="formLogin" novalidate>
            <label for="correo">Correo</label>
            <input type="email" id="correo" maxlength="100" required>
            <p class="error" id="errorCorreo"></p>

            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="4" maxlength="10" required>
            <p class="error" id="errorPassword"></p>

            <div class="acciones-form">
                <button type="submit" class="boton">Ingresar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Acceso interno · mismo catálogo y usuarios que la tienda</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
